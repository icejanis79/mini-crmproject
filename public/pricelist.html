<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ค้นราคาสินค้า</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
:root{
  --bg:#f4f6f5;
  --card:#ffffff;
  --line:#e1e6e2;
  --ink:#12201c;
  --ink-dim:#68766f;
  --petrol:#0e5c58;
  --petrol-dim:#e4f0ee;
  --tag:#c65d1e;
  --tag-dim:#fdeee2;
  --com:#1f6f4a;
  --com-dim:#e7f4ec;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  min-height:100vh;
  padding-bottom:40px;
}
header{
  position:sticky;top:0;z-index:10;
  background:var(--bg);
  padding:14px 14px 10px;
  border-bottom:1px solid var(--line);
}
.title-row{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;
}
.title-row h1{
  font-size:1.05rem;letter-spacing:-.01em;color:var(--ink);
  font-weight:800;
}
.title-row h1 span{color:var(--petrol);}
#count{font-size:.72rem;color:var(--ink-dim);font-family:'JetBrains Mono',monospace;font-weight:500;}
.search-wrap{position:relative;}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.4;pointer-events:none;}
#search{
  width:100%;padding:13px 14px 13px 40px;font-size:1.05rem;
  background:var(--card);border:2px solid var(--line);
  color:var(--ink);border-radius:10px;outline:none;
  font-family:'Inter',sans-serif;
}
#search::placeholder{color:#a3aca6;}
#search:focus{border-color:var(--petrol);}
.cats{
  display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;
  -webkit-overflow-scrolling:touch;
}
.cats::-webkit-scrollbar{display:none;}
.cat-btn{
  flex:0 0 auto;background:var(--card);border:1px solid var(--line);
  color:var(--ink-dim);padding:6px 12px;border-radius:20px;font-size:.72rem;
  white-space:nowrap;cursor:pointer;font-weight:600;
}
.cat-btn.active{border-color:var(--petrol);color:#fff;background:var(--petrol);}
 
main{padding:10px 12px 4px;max-width:720px;margin:0 auto;}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin-bottom:9px;
  display:flex;justify-content:space-between;gap:10px;align-items:flex-start;
}
.card-main{flex:1;min-width:0;}
.card .cat-label{
  display:inline-block;font-size:.62rem;color:var(--petrol);text-transform:uppercase;
  letter-spacing:.04em;font-weight:700;margin-bottom:4px;
  background:var(--petrol-dim);padding:2px 7px;border-radius:5px;
}
.card .code{color:var(--ink-dim);font-family:'JetBrains Mono',monospace;font-weight:500;}
.card .name{font-size:.97rem;font-weight:600;line-height:1.35;color:var(--ink);}
.card .meta{
  color:var(--ink-dim);font-size:.8rem;margin-top:3px;font-family:'JetBrains Mono',monospace;
}
.tiers{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;}
.tier{
  background:var(--com-dim);color:var(--com);
  font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:500;
  padding:2px 6px;border-radius:5px;
}
.tier b{font-weight:700;}
.note{margin-top:6px;color:var(--tag);font-size:.78rem;background:var(--tag-dim);padding:4px 8px;border-radius:6px;}
 
.tag{
  flex:0 0 auto;text-align:right;padding-top:2px;
}
.tag .old{
  display:block;font-size:.72rem;color:var(--ink-dim);text-decoration:line-through;
  font-family:'JetBrains Mono',monospace;margin-bottom:1px;
}
.tag .price{
  display:block;font-size:1.3rem;font-weight:800;color:var(--tag);
  font-family:'JetBrains Mono',monospace;white-space:nowrap;line-height:1.1;
}
.tag .missing{font-size:.72rem;color:var(--ink-dim);font-weight:600;max-width:110px;}
 
.empty{
  text-align:center;color:var(--ink-dim);padding:60px 20px;font-size:.9rem;
}
.empty b{color:var(--petrol);}
.status{font-size:.72rem;color:var(--com);font-weight:600;height:14px;margin-top:2px;}
.reset-link{
  background:none;border:none;color:var(--ink-dim);font-size:.68rem;text-decoration:underline;
  padding:0;margin-top:2px;cursor:pointer;font-family:'Inter',sans-serif;
}
.reset-link:active{color:var(--tag);}
 
.tabs{display:flex;gap:6px;margin-top:10px;}
.tab-btn{
  flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink-dim);
  padding:9px 6px;border-radius:8px;font-size:.82rem;font-weight:700;cursor:pointer;
}
.tab-btn.active{background:var(--petrol);border-color:var(--petrol);color:#fff;}
#search-view{margin-top:10px;}
 
#calc-view{display:none;padding:12px;max-width:720px;margin:0 auto;}
#calc-view.open{display:block;}
.calc-card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:16px;margin-bottom:12px;
}
.calc-title{font-size:.95rem;font-weight:800;color:var(--ink);margin-bottom:12px;}
.calc-label{
  display:flex;flex-direction:column;gap:5px;font-size:.78rem;color:var(--ink-dim);
  font-weight:600;margin-bottom:12px;
}
.calc-label select, .calc-label input{
  font-size:.95rem;padding:11px;border:1.5px solid var(--line);border-radius:8px;
  color:var(--ink);font-family:'Inter',sans-serif;background:var(--bg);
}
.calc-label select:focus, .calc-label input:focus{outline:none;border-color:var(--petrol);}
#calc-result{margin-top:6px;}
.calc-out{
  background:var(--petrol-dim);border-radius:10px;padding:14px;margin-top:6px;
}
.calc-out .line{display:flex;justify-content:space-between;font-size:.85rem;color:var(--ink);padding:4px 0;}
.calc-out .line b{font-family:'JetBrains Mono',monospace;color:var(--petrol);font-size:1rem;}
.calc-out .line.total b{color:var(--tag);font-size:1.15rem;}
.calc-warn{font-size:.78rem;color:var(--tag);background:var(--tag-dim);padding:8px 10px;border-radius:8px;margin-top:8px;}
 
.calc-cov-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.calc-hint{font-size:.68rem;color:var(--ink-dim);}
.cov-row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:8px 0;border-bottom:1px solid var(--line);
}
.cov-row:last-child{border-bottom:none;}
.cov-row .cov-name{font-size:.85rem;font-weight:600;color:var(--ink);}
.cov-row .cov-unit{font-size:.7rem;color:var(--ink-dim);}
.cov-row input{
  width:78px;text-align:right;padding:7px 8px;border:1.5px solid var(--line);border-radius:7px;
  font-family:'JetBrains Mono',monospace;font-size:.85rem;color:var(--ink);background:var(--bg);
}
.cov-row input:focus{outline:none;border-color:var(--petrol);}
 
.tag-col{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.edit-btn{
  border:1px solid var(--line);background:var(--card);color:var(--ink-dim);
  font-size:.68rem;font-weight:600;padding:3px 9px;border-radius:20px;cursor:pointer;
}
.edit-btn:active{background:var(--petrol-dim);color:var(--petrol);}
 
#fab{
  position:fixed;right:18px;bottom:22px;z-index:20;
  width:54px;height:54px;border-radius:50%;border:none;
  background:var(--petrol);color:#fff;font-size:1.7rem;font-weight:400;
  box-shadow:0 6px 18px rgba(14,92,88,.35);cursor:pointer;line-height:0;
}
#fab:active{transform:scale(.95);}
 
#modal{
  position:fixed;inset:0;z-index:30;display:none;
}
#modal.open{display:block;}
#modal-backdrop{position:absolute;inset:0;background:rgba(18,32,28,.45);}
.modal-sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;
  background:var(--card);border-radius:18px 18px 0 0;padding:18px 18px 24px;
  box-shadow:0 -8px 30px rgba(0,0,0,.2);
}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.modal-head h2{font-size:1.05rem;font-weight:800;color:var(--ink);}
.icon-btn{border:none;background:var(--bg);color:var(--ink-dim);width:30px;height:30px;border-radius:50%;font-size:1rem;cursor:pointer;}
#pform{display:flex;flex-direction:column;gap:11px;}
#pform label{font-size:.75rem;color:var(--ink-dim);font-weight:600;display:flex;flex-direction:column;gap:4px;}
#pform input{
  font-size:.95rem;padding:10px 11px;border:1.5px solid var(--line);border-radius:8px;
  color:var(--ink);font-family:'Inter',sans-serif;background:var(--bg);
}
#pform input:focus{outline:none;border-color:var(--petrol);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;}
.row4 input{padding:9px 6px;font-size:.85rem;}
.modal-actions{display:flex;gap:10px;margin-top:6px;}
.btn-save{
  flex:1;background:var(--petrol);color:#fff;border:none;padding:13px;border-radius:10px;
  font-size:1rem;font-weight:700;cursor:pointer;
}
.btn-delete{
  background:var(--tag-dim);color:var(--tag);border:none;padding:13px 16px;border-radius:10px;
  font-size:.9rem;font-weight:700;cursor:pointer;display:none;
}
</style>
</head>
<body>
<header>
  <div class="title-row"><h1><span>฿</span> ค้นราคาสินค้า</h1><span id="count"></span></div>
  <div id="status" class="status"></div>
  <button id="reset-link" class="reset-link">โหลดราคาล่าสุดทั้งหมดใหม่ (รีเซ็ต)</button>
  <div class="tabs">
    <button class="tab-btn active" id="tab-search">ค้นราคาสินค้า</button>
    <button class="tab-btn" id="tab-calc">คำนวณพื้นที่ท่อ</button>
  </div>
  <div id="search-view">
    <div class="search-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#12201c" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" type="text" placeholder="พิมพ์ชื่อสินค้า / รหัส / ขนาด..." autocomplete="off" autofocus>
    </div>
    <div class="cats" id="cats"></div>
  </div>
</header>
<main id="results"></main>
 
<div id="calc-view">
  <div class="calc-card">
    <h2 class="calc-title">คำนวณพื้นที่ท่อ / จำนวนที่ต้องใช้</h2>
    <label class="calc-label">ยี่ห้อ/ชนิดสินค้า
      <select id="calc-brand"></select>
    </label>
    <label class="calc-label" id="calc-size-wrap">ขนาด
      <select id="calc-size"></select>
    </label>
    <div class="row2">
      <label class="calc-label">ขนาดท่อ (นิ้ว)
        <select id="calc-pipe-size"></select>
      </label>
      <label class="calc-label">ความยาวท่อ (เมตร)
        <input id="calc-length" type="number" inputmode="decimal" placeholder="เช่น 10">
      </label>
    </div>
    <div id="calc-result"></div>
  </div>
 
  <div class="calc-card">
    <div class="calc-cov-head">
      <h2 class="calc-title">ตารางพื้นที่คุ้มครองต่อหน่วย (ตรม.)</h2>
      <span class="calc-hint">แก้ตัวเลขได้ถ้าค่าเปลี่ยน — บันทึกอัตโนมัติ</span>
    </div>
    <div id="coverage-table"></div>
  </div>
</div>
 
<button id="fab" title="เพิ่มสินค้าใหม่">+</button>
 
<div id="modal">
 
  <div id="modal-backdrop"></div>
  <div class="modal-sheet">
    <div class="modal-head">
      <h2 id="modal-title">เพิ่มสินค้าใหม่</h2>
      <button type="button" id="cancel-btn" class="icon-btn">✕</button>
    </div>
    <form id="pform">
      <datalist id="cat-options"></datalist>
      <label>หมวดหมู่<input name="cat" list="cat-options" placeholder="เช่น CRC, LUKO"></label>
      <label>ชื่อสินค้า *<input name="n" required placeholder="ชื่อสินค้า"></label>
      <label>ขนาด/แพ็ค<input name="p" placeholder="เช่น 400 ml/Can"></label>
      <label>รหัสสินค้า<input name="code" placeholder="รหัส (ถ้ามี)"></label>
      <div class="row2">
        <label>ราคาเก่า<input name="old" type="number" inputmode="decimal" placeholder="ไม่บังคับ"></label>
        <label>ราคาใหม่<input name="price" type="number" inputmode="decimal" placeholder="ราคาขาย"></label>
      </div>
      <div class="row4">
        <label>คอม 10%<input name="c10" type="number" inputmode="decimal"></label>
        <label>คอม 7%<input name="c7" type="number" inputmode="decimal"></label>
        <label>คอม 5%<input name="c5" type="number" inputmode="decimal"></label>
        <label>คอม 3%<input name="c3" type="number" inputmode="decimal"></label>
      </div>
      <label>หมายเหตุ<input name="note" placeholder="ไม่บังคับ"></label>
      <div class="modal-actions">
        <button type="button" id="delete-btn" class="btn-delete">ลบสินค้านี้</button>
        <button type="submit" class="btn-save">บันทึก</button>
      </div>
    </form>
  </div>
</div>

const STORE_KEY = "products-v1";
let PRODUCTS = [];
const catsDiv = document.getElementById('cats');
const resultsDiv = document.getElementById('results');
const searchInput = document.getElementById('search');
const countEl = document.getElementById('count');
const statusEl = document.getElementById('status');
let activeCat = "ทั้งหมด";
let editingId = null;
 
function fmt(n){ return n==null || n==="" ? "" : Number(n).toLocaleString('en-US'); }
function uid(){ return 'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,7); }
function keyOf(item){
  const norm = s => (s||'').toString().toLowerCase().replace(/[^a-z0-9ก-๙]/g,'');
  return item.code ? 'c:'+norm(item.code) : 'n:'+norm(item.n)+'|'+norm(item.p);
}
 
async function loadProducts(){
  try{
    statusEl.textContent = "กำลังโหลดข้อมูลจาก Google Sheet...";
    const res = await fetch('/api/pricelist');
    const apiProducts = await res.json();
    if(apiProducts && apiProducts.length > 0){
      PRODUCTS = apiProducts;
      mergeNewSeedItems();
    } else {
      PRODUCTS = SEED_DATA.map(d=>({...d, id: uid()}));
      await saveProducts(true);
    }
    statusEl.textContent = "";
  }catch(e){
    PRODUCTS = SEED_DATA.map(d=>({...d, id: uid()}));
    statusEl.textContent = "";
  }
  renderCats();
  render();
}
 
function mergeNewSeedItems(){
  const existingKeys = new Set(PRODUCTS.map(keyOf));
  let added = 0;
  SEED_DATA.forEach(seed=>{
    const k = keyOf(seed);
    if(!existingKeys.has(k)){
      PRODUCTS.push({...seed, id: uid()});
      existingKeys.add(k);
      added++;
    }
  });
  if(added>0) saveProducts(true);
}
 
async function saveProducts(silent){
  try{
    if(!silent) statusEl.textContent = "กำลังบันทึกลง Google Sheet...";
    await fetch('/api/pricelist', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ products: PRODUCTS })
    });
    if(!silent){ statusEl.textContent = "บันทึกลง Google Sheet สำเร็จ!"; setTimeout(()=>statusEl.textContent="",2000); }
  }catch(e){
    statusEl.textContent = "บันทึกไม่สำเร็จ กรุณาลองใหม่";
  }
}
 
function renderCats(){
  const cats = ["ทั้งหมด", ...new Set(PRODUCTS.map(d=>d.cat).filter(Boolean))];
  catsDiv.innerHTML = "";
  cats.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'cat-btn' + (c===activeCat?' active':'');
    b.textContent = c;
    b.onclick = ()=>{
      activeCat = c;
      document.querySelectorAll('.cat-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      render();
    };
    catsDiv.appendChild(b);
  });
}
 
function render(){
  const q = searchInput.value.trim().toLowerCase();
  let items = PRODUCTS.filter(d=>{
    const matchesCat = activeCat==="ทั้งหมด" || d.cat===activeCat;
    if(!matchesCat) return false;
    if(!q) return true;
    const hay = (d.n+" "+(d.p||"")+" "+(d.code||"")+" "+d.cat).toLowerCase();
    return hay.includes(q);
  });
  countEl.textContent = items.length + " รายการ";
  if(items.length===0){
    resultsDiv.innerHTML = `<div class="empty">ไม่พบสินค้าที่ตรงกับ <b>"${searchInput.value}"</b><br>ลองพิมพ์ชื่อสินค้าสั้นลง หรือรหัสสินค้า<br><br>หรือกด <b>+</b> ด้านล่างเพื่อเพิ่มสินค้านี้</div>`;
    return;
  }
  resultsDiv.innerHTML = items.slice(0,200).map(d=>{
    let tiers = "";
    if(d.c10) tiers += `<span class="tier">10% <b>${fmt(d.c10)}</b></span>`;
    if(d.c7) tiers += `<span class="tier">7% <b>${fmt(d.c7)}</b></span>`;
    if(d.c5) tiers += `<span class="tier">5% <b>${fmt(d.c5)}</b></span>`;
    if(d.c3) tiers += `<span class="tier">3% <b>${fmt(d.c3)}</b></span>`;
    const oldPrice = d.old && d.old!==d.price ? `<span class="old">${fmt(d.old)}</span>` : "";
    const tagBlock = d.price!=null && d.price!==""
      ? `<div class="tag">${oldPrice}<span class="price">฿${fmt(d.price)}</span></div>`
      : `<div class="tag"><span class="missing">เช็คราคากับฝ่ายขาย</span></div>`;
    return `<div class="card">
      <div class="card-main">
        <span class="cat-label">${d.cat||"ไม่ระบุหมวด"}</span>${d.code?` <span class="code">${d.code}</span>`:""}
        <div class="name">${d.n}</div>
        ${d.p?`<div class="meta">${d.p}</div>`:""}
        ${tiers?`<div class="tiers">${tiers}</div>`:""}
        ${d.note?`<div class="note">${d.note}</div>`:""}
      </div>
      <div class="tag-col">
        ${tagBlock}
        <button class="edit-btn" onclick="openModal('${d.id}')">แก้ไข</button>
      </div>
    </div>`;
  }).join('');
}
 
/* ---- Add / edit modal ---- */
const modal = document.getElementById('modal');
const form = document.getElementById('pform');
const fld = name => form.elements.namedItem(name);
function openModal(id){
  editingId = id || null;
  const d = id ? PRODUCTS.find(x=>x.id===id) : {};
  fld('cat').value = d.cat || "";
  fld('n').value = d.n || "";
  fld('p').value = d.p || "";
  fld('code').value = d.code || "";
  fld('old').value = d.old ?? "";
  fld('price').value = d.price ?? "";
  fld('c10').value = d.c10 ?? "";
  fld('c7').value = d.c7 ?? "";
  fld('c5').value = d.c5 ?? "";
  fld('c3').value = d.c3 ?? "";
  fld('note').value = d.note || "";
  document.getElementById('modal-title').textContent = id ? "แก้ไขสินค้า" : "เพิ่มสินค้าใหม่";
  document.getElementById('delete-btn').style.display = id ? "block" : "none";
  const catList = document.getElementById('cat-options');
  catList.innerHTML = [...new Set(PRODUCTS.map(x=>x.cat).filter(Boolean))].map(c=>`<option value="${c}">`).join('');
  modal.classList.add('open');
  fld('n').focus();
}
function closeModal(){ modal.classList.remove('open'); }
function numOrNull(v){ return v===""||v==null ? null : Number(v); }
 
form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const obj = {
    id: editingId || uid(),
    cat: fld('cat').value.trim() || "ไม่ระบุหมวด",
    n: fld('n').value.trim(),
    p: fld('p').value.trim(),
    code: fld('code').value.trim(),
    old: numOrNull(fld('old').value),
    price: numOrNull(fld('price').value),
    c10: numOrNull(fld('c10').value),
    c7: numOrNull(fld('c7').value),
    c5: numOrNull(fld('c5').value),
    c3: numOrNull(fld('c3').value),
    note: fld('note').value.trim(),
  };
  if(!obj.n){ return; }
  if(editingId){
    const idx = PRODUCTS.findIndex(x=>x.id===editingId);
    if(idx>-1) PRODUCTS[idx] = obj;
  } else {
    PRODUCTS.unshift(obj);
  }
  await saveProducts();
  closeModal();
  renderCats();
  render();
});
 
document.getElementById('delete-btn').addEventListener('click', async ()=>{
  if(!editingId) return;
  if(!confirm('ลบสินค้านี้?')) return;
  PRODUCTS = PRODUCTS.filter(x=>x.id!==editingId);
  await saveProducts();
  closeModal();
  renderCats();
  render();
});
 
document.getElementById('fab').addEventListener('click', ()=>openModal(null));
document.getElementById('modal-backdrop').addEventListener('click', closeModal);
document.getElementById('cancel-btn').addEventListener('click', closeModal);
 
searchInput.addEventListener('input', render);

function switchTab(which){
  const isSearch = which === 'search';
  tabSearch.classList.toggle('active', isSearch);

  searchView.style.display = isSearch ? '' : 'none';
  resultsDiv.style.display = isSearch ? '' : 'none';

}
tabSearch.addEventListener('click', ()=>switchTab('search'));
tabCalc.addEventListener('click', ()=>switchTab('calc'));
 
/* ---- Pipe area calculator ---- */
const COV_KEY = "coverage-v1";
const SEED_COVERAGE = [
  {id:"polyken-tape-2",  brand:"Polyken Tape", size:"2 นิ้ว", unit:"ม้วน (Roll)", coverage:0.64},
  {id:"polyken-tape-4",  brand:"Polyken Tape", size:"4 นิ้ว", unit:"ม้วน (Roll)", coverage:1.12},
  {id:"polyken-tape-6",  brand:"Polyken Tape", size:"6 นิ้ว", unit:"ม้วน (Roll)", coverage:1.92},
  {id:"polyken-primer",  brand:"Polyken Primer", size:"1 แกลลอน / 3.78 ลิตร", unit:"แกลลอน", coverage:40},
  {id:"denso-tape-2",    brand:"Denso Tape", size:"2 นิ้ว", unit:"ม้วน (Roll)", coverage:0.22},
  {id:"denso-tape-4",    brand:"Denso Tape", size:"4 นิ้ว", unit:"ม้วน (Roll)", coverage:0.44},
  {id:"sxp-wrap-2",      brand:"SealXPert Poly Wrap", size:"2 นิ้ว", unit:"ม้วน (Roll)", coverage:0.64},
  {id:"sxp-wrap-3",      brand:"SealXPert Poly Wrap", size:"3 นิ้ว", unit:"ม้วน (Roll)", coverage:null},
  {id:"sxp-wrap-4",      brand:"SealXPert Poly Wrap", size:"4 นิ้ว", unit:"ม้วน (Roll)", coverage:1.12},
  {id:"sxp-wrap-5",      brand:"SealXPert Poly Wrap", size:"5 นิ้ว", unit:"ม้วน (Roll)", coverage:null},
  {id:"sxp-wrap-6",      brand:"SealXPert Poly Wrap", size:"6 นิ้ว", unit:"ม้วน (Roll)", coverage:1.92},
];
let COVERAGE = [];
 
function loadCoverage(){
  try{
    const raw = localStorage.getItem(COV_KEY);
    COVERAGE = raw ? JSON.parse(raw) : SEED_COVERAGE.map(c=>({...c}));
    if(!raw) saveCoverage();
  }catch(e){
    COVERAGE = SEED_COVERAGE.map(c=>({...c}));
  }
  populateBrandSelect();
  renderCoverageTable();
}
function saveCoverage(){
  try{ localStorage.setItem(COV_KEY, JSON.stringify(COVERAGE)); }catch(e){}
}
 
const PIPE_SIZE_TABLE = [
  {size:"1/8", pipe:0.03}, {size:"1/4", pipe:0.04}, {size:"3/8", pipe:0.05}, {size:"1/2", pipe:0.07},
  {size:"3/4", pipe:0.08}, {size:"1", pipe:0.10}, {size:"1.1/4", pipe:0.13}, {size:"1.1/2", pipe:0.15},
  {size:"2", pipe:0.19}, {size:"2.1/2", pipe:0.23}, {size:"3", pipe:0.28}, {size:"3.1/2", pipe:0.32},
  {size:"4", pipe:0.36}, {size:"5", pipe:0.44}, {size:"6", pipe:0.53}, {size:"8", pipe:0.69},
  {size:"10", pipe:0.86}, {size:"12", pipe:1.02}, {size:"14", pipe:1.12}, {size:"16", pipe:1.28},
  {size:"18", pipe:1.44}, {size:"20", pipe:1.60}, {size:"22", pipe:1.75}, {size:"24", pipe:1.91},
  {size:"26", pipe:2.07}, {size:"28", pipe:2.23}, {size:"30", pipe:2.39}, {size:"32", pipe:2.55},
  {size:"34", pipe:2.71}, {size:"36", pipe:2.87}, {size:"38", pipe:3.03}, {size:"40", pipe:3.19},
  {size:"42", pipe:3.35}, {size:"44", pipe:3.51}, {size:"46", pipe:3.67}, {size:"48", pipe:3.83},
  {size:"50", pipe:3.99}, {size:"52", pipe:4.14}, {size:"54", pipe:4.30}, {size:"56", pipe:4.47},
  {size:"60", pipe:4.79}, {size:"64", pipe:5.10}, {size:"66", pipe:5.42}, {size:"72", pipe:5.74},
  {size:"80", pipe:6.38}, {size:"88", pipe:7.02}, {size:"100", pipe:7.98},
];
 
const brandSel = document.getElementById('calc-brand');
const sizeSel = document.getElementById('calc-size');
const pipeSizeSel = document.getElementById('calc-pipe-size');
const lenInput = document.getElementById('calc-length');
const calcResultDiv = document.getElementById('calc-result');
 
pipeSizeSel.innerHTML = PIPE_SIZE_TABLE.map(p=>`<option value="${p.size}">${p.size}"</option>`).join('');
 
function populateBrandSelect(){
  const brands = [...new Set(COVERAGE.map(c=>c.brand))];
  brandSel.innerHTML = brands.map(b=>`<option value="${b}">${b}</option>`).join('');
  populateSizeSelect();
}
function populateSizeSelect(){
  const items = COVERAGE.filter(c=>c.brand===brandSel.value);
  sizeSel.innerHTML = items.map(s=>`<option value="${s.id}">${s.size}</option>`).join('');
  runCalc();
}
brandSel.addEventListener('change', populateSizeSelect);
sizeSel.addEventListener('change', runCalc);
pipeSizeSel.addEventListener('change', runCalc);
lenInput.addEventListener('input', runCalc);
 
function renderCoverageTable(){
  document.getElementById('coverage-table').innerHTML = COVERAGE.map(c=>`
    <div class="cov-row">
      <div>
        <div class="cov-name">${c.brand} — ${c.size}</div>
        <div class="cov-unit">ตรม. ต่อ ${c.unit}</div>
      </div>
      <input type="number" inputmode="decimal" step="0.01" value="${c.coverage ?? ''}" data-id="${c.id}" placeholder="กรอก">
    </div>
  `).join('');
  document.querySelectorAll('#coverage-table input').forEach(inp=>{
    inp.addEventListener('change', (e)=>{
      const item = COVERAGE.find(c=>c.id===e.target.dataset.id);
      item.coverage = e.target.value === '' ? null : Number(e.target.value);
      saveCoverage();
      runCalc();
    });
  });
}
 
function runCalc(){
  const item = COVERAGE.find(c=>c.id===sizeSel.value);
  if(!item){ calcResultDiv.innerHTML = ''; return; }
  const pipeRow = PIPE_SIZE_TABLE.find(p=>p.size===pipeSizeSel.value);
  const len = parseFloat(lenInput.value);
  if(!pipeRow || !len){
    calcResultDiv.innerHTML = `<div class="calc-warn">เลือกขนาดท่อและกรอกความยาวท่อให้ครบก่อน</div>`;
    return;
  }
  const area = pipeRow.pipe * len;
  if(item.coverage == null || item.coverage <= 0){
    calcResultDiv.innerHTML = `
      <div class="calc-out"><div class="line"><span>พื้นที่ท่อโดยประมาณ</span><b>${area.toFixed(2)} ตรม.</b></div></div>
      <div class="calc-warn">ยังไม่มีข้อมูลพื้นที่คุ้มครองของ ${item.brand} ${item.size} — กรอกในตารางด้านล่างก่อนถึงจะคำนวณจำนวนที่ต้องใช้ได้</div>`;
    return;
  }
  const units = Math.ceil(area / item.coverage);
  calcResultDiv.innerHTML = `
    <div class="calc-out">
      <div class="line"><span>พื้นที่ท่อโดยประมาณ</span><b>${area.toFixed(2)} ตรม.</b></div>
      <div class="line total"><span>ต้องใช้ ${item.brand} ${item.size}</span><b>${units} ${item.unit}</b></div>
    </div>`;
}
 
loadCoverage();
loadProducts();

  if(!confirm('โหลดราคาล่าสุดทั้งหมดใหม่? ราคาที่เคยแก้ไข/เพิ่มเองในเครื่องนี้จะถูกแทนที่ด้วยค่าตั้งต้นทั้งหมด')) return;
  try{ localStorage.removeItem(STORE_KEY); localStorage.removeItem(COV_KEY); }catch(e){}
  PRODUCTS = SEED_DATA.map(d=>({...d, id: uid()}));
  saveProducts(true);
  COVERAGE = SEED_COVERAGE.map(c=>({...c}));
  saveCoverage();
  renderCats();
  render();
  populateBrandSelect();
  renderCoverageTable();
  statusEl.textContent = "โหลดข้อมูลล่าสุดแล้ว";
  setTimeout(()=>statusEl.textContent="",2000);
});
